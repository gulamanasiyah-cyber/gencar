name = "gencar-api"
main = "server/src/index.ts"
compatibility_date = "2025-05-05"
compatibility_flags = [ "nodejs_compat" ]

# SPA Vite — di-build ke frontend/dist, Worker serve via assets binding (SPA fallback)
[assets]
directory = "frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# D1 — isi database_id setelah `wrangler d1 create gencar-db`
# [[d1_databases]]
# binding = "DB"
# database_name = "gencar-db"
# database_id = "REPLACE_ME"

# KV untuk magic_tokens rate-limit & session (buat via `wrangler kv namespace create`)
# [[kv_namespaces]]
# binding = "KV"
# id = "REPLACE_ME"

# R2 untuk upload gambar (buat via `wrangler r2 bucket create gencar-uploads`)
# [[r2_buckets]]
# binding = "R2_BUCKET"
# bucket_name = "gencar-uploads"

[vars]
DAERAH_NAMA = "Cengkareng"

[build]
command = "npm run build --prefix ./frontend"
