# ==================================================================
#  Gencar — produksi (server Ubuntu 24.04)
#
#  Jangan dijalankan langsung dengan "docker compose up": pakai
#      bash deploy/deploy.sh        (memasang versi terbaru)
#      bash deploy/dc.sh <perintah> (ps, logs, restart, ...)
#  yang mengisi variabel GC_* di bawah.
#
#  - Database: Turso (libSQL cloud) — bukan di dalam Docker.
#  - Port 3102 hanya dibuka untuk 127.0.0.1; dari internet hanya lewat
#    nginx (https) yang berjalan di server (bukan di dalam Docker).
#  - Wadah berjalan sebagai pengguna deploy (bukan root) dan hanya bisa
#    menulis ke /tmp (tmpfs).
#  - Pengaturan & rahasia dibaca aplikasi dari env_file.
# ==================================================================
name: gencar

services:
  app:
    image: gencar:${GC_TAG:-terbaru}
    build: .
    restart: unless-stopped
    user: "${GC_UID:-1001}:${GC_GID:-1001}"
    env_file:
      - path: ${GC_DATA:-/srv/data/gencar}/.env
        required: false
      - path: .env.production
        required: false
    environment:
      NODE_ENV: production
      PORT: "3102"
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: "1"
      TZ: Asia/Jakarta
    ports:
      - "127.0.0.1:${GC_PORT:-3102}:3102"
    deploy:
      resources:
        limits:
          cpus: "${GC_CPU_LIMIT:-1.0}"
          memory: ${GC_MEM_LIMIT:-512M}
        reservations:
          cpus: "${GC_CPU_RESERVATION:-0.25}"
          memory: ${GC_MEM_RESERVATION:-128M}

    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3102/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
