services:
  # ============================================================
  # Next.js Application
  # ============================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: gencar-app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 5315
      HOSTNAME: "0.0.0.0"
    expose:
      - "5315"
    networks:
      - gencar-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5315/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M

  # ============================================================
  # Nginx Reverse Proxy
  # ============================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: gencar-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/gencar.conf:/etc/nginx/conf.d/default.conf:ro
      - /srv/data/gencar/ssl:/etc/nginx/ssl:ro
      - /srv/data/gencar/certbot/www:/var/www/certbot:ro
      - nginx-cache:/var/cache/nginx
    networks:
      - gencar-net
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

networks:
  gencar-net:
    driver: bridge

volumes:
  nginx-cache:
    driver: local
