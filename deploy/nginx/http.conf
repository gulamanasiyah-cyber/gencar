# Gencar — konfigurasi HTTP (tanpa SSL)
# Dipakai saat pertama kali setup server agar Nginx bisa aktif dan Certbot bisa memvalidasi domain.
server {
    listen 80;
    listen [::]:80;
    server_name @SERVER_NAME@;

    server_tokens off;
    client_max_body_size 12m;

    # Validasi Let's Encrypt (Certbot webroot)
    location ^~ /.well-known/acme-challenge/ {
        root @WEBROOT@;
        default_type text/plain;
    }

    # Proxy ke aplikasi Next.js (127.0.0.1:3102)
    location / {
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Halaman sedang diperbarui saat deploy/restart
    error_page 502 503 504 =503 /sedang-diperbarui.html;
    location = /sedang-diperbarui.html {
        root @WEBROOT@;
        internal;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
    }
}
