# Gencar — konfigurasi HTTPS (dengan SSL)
# Diterapkan setelah sertifikat Let's Encrypt berhasil diterbitkan.

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=gc_api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=gc_general:10m rate=100r/m;

server {
    listen 80;
    listen [::]:80;
    server_name @SERVER_NAME@;
    server_tokens off;

    # Validasi Let's Encrypt (untuk perpanjangan sertifikat otomatis)
    location ^~ /.well-known/acme-challenge/ {
        root @WEBROOT@;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name @SERVER_NAME@;

    ssl_certificate     /etc/letsencrypt/live/@DOMAIN@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@DOMAIN@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:gc_ssl:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 12m;

    # Static assets — cache panjang
    location /_next/static/ {
        proxy_pass http://127.0.0.1:@PORT@;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /public/ {
        proxy_pass http://127.0.0.1:@PORT@;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # API routes — rate limited, no cache
    location /api/ {
        limit_req zone=gc_api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:@PORT@;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # All other routes
    location / {
        limit_req zone=gc_general burst=50 nodelay;

        proxy_pass http://127.0.0.1:@PORT@;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # Halaman sedang diperbarui saat deploy/restart
    error_page 502 503 504 =503 /sedang-diperbarui.html;
    location = /sedang-diperbarui.html {
        root @WEBROOT@;
        internal;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
